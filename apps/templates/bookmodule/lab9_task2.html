{% extends "layouts/base.html" %}

{% block title %}Publisher Stock{% endblock %}

{% block content %}
<h1>Publisher Stock</h1>

<table>
    <thead>
        <tr>
            <th>Publisher</th>
            <th>Total Stock</th>
        </tr>
    </thead>
    <tbody>
        {% for publisher in publishers %}
        <tr>
            <td>{{ publisher.name }}</td>
            <td>{{ publisher.total_stock }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No publishers found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
