{% extends "layouts/base.html" %}

{% block title %}{% if editing %}Edit Book{% else %}Add New Book{% endif %}{% endblock %}

{% block content %}
<h1>{% if editing %}Edit Book{% else %}Add New Book{% endif %}</h1>

{% if error %}
    <p role="alert">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>
        <label for="title">Title:</label>
        <input id="title" name="title" maxlength="100"
               value="{{ values.title }}" required>
    </p>

    <p>
        <label for="author">Author:</label>
        <input id="author" name="author" maxlength="50"
               value="{{ values.author }}" required>
    </p>

    <p>
        <label for="price">Price:</label>
        <input id="price" name="price" type="number" min="0" step="0.01"
               value="{{ values.price }}" required>
    </p>

    <p>
        <label for="edition">Edition:</label>
        <input id="edition" name="edition" type="number" min="1" max="32767"
               value="{{ values.edition|default:'1' }}" required>
    </p>

    <button type="submit">Save Book</button>
    <a href="{% url 'books.lab10_part1_listbooks' %}">Cancel</a>
</form>
{% endblock %}
