{% extends "layouts/base.html" %}

{% block title %}Students per City{% endblock %}

{% block content %}
<h1>Students per City</h1>

<table>
    <thead>
        <tr>
            <th>City</th>
            <th>Number of Students</th>
        </tr>
    </thead>
    <tbody>
        {% for row in cities %}
        <tr>
            <td>{{ row.city }}</td>
            <td>{{ row.student_count }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No cities found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
