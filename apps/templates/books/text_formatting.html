{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>

<h1>Example of Formatting tags</h1>

<p>
    This is a <b>bold</b> text.
</p>

<p>
    This is an <strong>important</strong> text.
</p>

<p>
    This is an <i>italic</i> text.
</p>

<p>
    This is an <em>emphasized</em> text.
</p>

<p>
    This is a <mark>highlighted</mark> text.
</p>

<p>
    This is a <small>small</small> text.
</p>

<p>
    This is a <del>deleted</del> text.
</p>

<p>
    This is an <ins>inserted</ins> text.
</p>

<p>
    H<sub>2</sub>O
</p>

<p>
    X<sup>2</sup>
</p>

</body>
</html>
